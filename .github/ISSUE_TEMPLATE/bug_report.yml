name: Bug report
description: Report incorrect runtime or rendering behavior
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Include relevant state/action/surface information.
    validations:
      required: true

  - type: input
    id: revision
    attributes:
      label: teloxide-ui revision

  - type: input
    id: teloxide
    attributes:
      label: teloxide revision/version
